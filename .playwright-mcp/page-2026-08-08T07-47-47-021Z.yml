  - heading "Observaciones estratégicas" [level=2] [ref=e300]
  - list [ref=e301]:
    - listitem [ref=e302]:
      - strong [ref=e303]: Nexo Soluciones
      - text: controla varios cines de la región (Las Tipas San Jorge/Rosario, e-Max Esperanza, Cine Libertador). Los sitios más nuevos funcionan correctamente, pero todos comparten la misma plantilla y no se diferencian visualmente.
    - listitem [ref=e304]:
      - text: Los
      - strong [ref=e305]: cines sin sitio propio
      - text: (Teatro Verdi Venado Tuerto, CineClú, Sala AMR, Espacio INCAA Rufino) representan la oportunidad más limpia, ya que no compiten con un proveedor establecido.
    - listitem [ref=e306]:
      - text: Los
      - strong [ref=e307]: espacios culturales municipales
      - text: (Fontanarrosa, Lavardén, La Comedia) tienen programación activa pero alojada en portales genéricos. Requieren aprobación gubernamental.
    - listitem [ref=e308]:
      - text: El
      - strong [ref=e309]: Cine Libertador de Casilda
      - text: "es el caso más urgente: el sitio está visiblemente roto y bloquea el canal de venta."
  - heading "Plantilla de correo para enviar a los cines" [level=2] [ref=e310]
  - paragraph [ref=e311]: Texto listo para personalizar y enviar. Reemplazá los campos marcados en amarillo.
  - generic [ref=e312]:
    - 'heading "Asunto: Propuesta para renovar el sitio web de [NOMBRE DEL CINE]" [level=3] [ref=e313]'
    - paragraph [ref=e314]: Hola, ¿cómo están?
    - paragraph [ref=e315]: Mi nombre es [NOMBRE Y APELLIDO], soy ingeniero en sistemas.
    - paragraph [ref=e316]: Estuve visitando el sitio web de [NOMBRE DEL CINE] y noté algunos problemas con la cartelera, los horarios y la experiencia desde celulares. Me interesa ofrecerles, si están abiertos a evaluarlo, el desarrollo de una solución web más moderna y confiable.
    - paragraph [ref=e317]: La propuesta podría incluir cartelera, horarios, estrenos, promociones, acceso a venta online y un panel sencillo para administrar el contenido.
    - paragraph [ref=e318]: ¿Podrían indicarme si les interesaría conversar sobre esta posibilidad o derivarme con la persona responsable del sitio?
    - paragraph [ref=e319]: En caso de que este mensaje no corresponda a su área, les agradecería si pudieran derivarlo a quien corresponda.
    - paragraph [ref=e320]: Saludos cordiales,
    - paragraph [ref=e321]:
      - strong [ref=e322]: Ing. [NOMBRE Y APELLIDO]
      - text: "WhatsApp: [NÚMERO] Correo: [CORREO] [LINKEDIN O PORTFOLIO, OPCIONAL]"
  - generic [ref=e323]:
    - strong [ref=e324]: "Recomendación:"
    - text: No incluyas precio en el primer contacto. El objetivo inicial es conseguir una respuesta y llegar a la persona que toma la decisión. Si te piden más detalle, enviá una propuesta específica con alcance y referencia de precio.
  - generic [ref=e325]: Reporte elaborado el 8 de agosto de 2026 a partir de fuentes públicas verificadas. Los datos de contacto y estado de los sitios corresponden al momento de la verificación y pueden variar.