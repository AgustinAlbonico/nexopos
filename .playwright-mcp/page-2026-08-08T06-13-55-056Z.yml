                - generic [ref=f26e220]: Tammy Steinmann
                - generic [ref=f26e221]: The Grand Theatre
        - group [ref=f26e222]:
          - generic [ref=f26e224]:
            - paragraph [ref=f26e226]: “We’ve always operated our box office with two doors open for both lines of traffic, we can’t change that. But now that we have Veezi, a third person using a tablet can move along the queue of cars, selling tickets in advance of reaching the box office. This has sped up the entry process for everyone."
            - generic [ref=f26e230]:
              - generic [ref=f26e231]: Chip Sawyer
              - generic [ref=f26e232]: SilverMoon Drive In
        - group [ref=f26e233]:
          - generic [ref=f26e235]:
            - paragraph [ref=f26e237]: “We can see how Veezi cuts through what can be a ridiculous amount of information to digest. The programming and listing of the sessions with tickets is simplified to such a degree it is quick and really easy to use.”
            - generic [ref=f26e241]:
              - generic [ref=f26e242]: Mark & Jess Walker
              - generic [ref=f26e243]: Pivotonian
        - group [ref=f26e244]:
          - generic [ref=f26e246]:
            - paragraph [ref=f26e248]: “Veezi is easy to learn, particularly the Concessions tab. Up it pops, you can refresh the tills, change the colors and add in an item in two to three easy steps. Push save and you are set.”
            - generic [ref=f26e252]:
              - generic [ref=f26e253]: Geoff Glen
              - generic [ref=f26e254]: Peckhamplex
        - group [ref=f26e255]:
          - generic [ref=f26e257]:
            - paragraph [ref=f26e259]: “I can’t stress it enough, the Veezi team is amazing. We don’t need them often because everything works so well, but because we are a festival we need certain accommodations, and the team are always pleasant, quick to respond, and go the extra mile,” Jen exclaims.“With Veezi, we are future-proofed”
