          - generic [ref=f26e214]:
            - paragraph [ref=f26e215]: "\"Veezi is so self-explanatory... now I am able to throw a new person on the register at a busy time, and they pick it up real fast. It used to take weeks before I would roster them on a busy night. I absolutely love Veezi and their amazing support.\""
