    - generic [ref=e229]:
      - generic [ref=e230]:
        - paragraph [ref=e231]: Frequently Asked Questions
        - heading "Got questions? We’ve got answers." [level=2] [ref=e232]
      - list [ref=e233]:
        - listitem [ref=e234]:
          - button "Is it really free for free events?" [expanded] [ref=e235] [cursor=pointer]
          - region [ref=e239]:
            - paragraph [ref=e240]: SimpleTix service fees on free tickets on general admission and flex pass events are always free. There are absolutely no hidden costs. SimpleTix allows free ticket levels if the event meets our requirements. For example, we cannot make multi-day/multi-event time tickets free. We are happy to give you a quote! For reserved seat mode events - we charge a smalll $0.25 fee on free tickets to offset our higher costs.
        - listitem [ref=e241]:
          - button "Are there any upfront costs or ongoing subscription fees?" [ref=e242] [cursor=pointer]
          - region:
            - paragraph [ref=e247]: It’s completely free to sign up with SimpleTix and post your event. There are no setup, monthly or ongoing charges. We will even build your seating charts for free. SimpleTix will only charge a fee when attendees pay money to buy a ticket or register for your event.
        - listitem [ref=e248]:
          - button "What are the various fees and charges applicable?" [ref=e249] [cursor=pointer]
          - region:
            - paragraph [ref=e254]: SimpleTix charges a service fee only for events where you charge your attendees to register. You will be charged 2% + 0.79 per sold ticket / registration and this fee is capped at a maximum of $9.99 regardless of what you charge your attendees. Our fee is capped at a maximum of $9.99.
            - paragraph [ref=e255]: Apart from SimpleTix's service fees, you will also be charged payment processing fees depending on your selected payment processor.
        - listitem [ref=e256]:
          - button "What are payment processing fees?" [ref=e257] [cursor=pointer]
          - region:
            - paragraph [ref=e262]: SimpleTix supports Square, Stripe, PayPal, and Authorize.net. Please refer to your processor's website to see the applicable processing fees for your specific location and currency.
            - paragraph [ref=e263]: Square offers a lower rate for in-person payments when using our Event Organizer mobile app.
        - listitem [ref=e264]:
          - button "How does SimpleTix collect the convenience fee for paid events?" [ref=e265] [cursor=pointer]
          - region:
            - paragraph [ref=e270]: When you use Square (USA account only), Stripe, or PayPal to collect payments, our service fee is deducted seamlessly during the transactions, and this is by far the most convenient approach.
            - paragraph [ref=e271]: For all other payment methods including other payment processors (Authorize.net, Braintree, SafeSave, NMI, SimPay, Square Canada, Square United Kingdom, Square Australia) as well as offline registrations (check, cash, bank transfers) we will charge your credit card the 1st of the following month for tickets sold.
        - listitem [ref=e272]:
          - button "Can I pass the fees on to my ticket purchasers?" [ref=e273] [cursor=pointer]
          - region:
            - paragraph [ref=e278]: Yes, you can choose to either absorb SimpleTix’s service fee or pass it on directly to your attendees.
        - listitem [ref=e279]:
          - button "Is there discounted pricing for charities and NPOs?" [ref=e280] [cursor=pointer]
          - region:
            - paragraph [ref=e285]: Yes, SimpleTix offers 10% off on our fee for non-profit organizations. This discount is applied on the platform fee and not on the credit card processing fee. Create your event page and send the event name and your username (email address registered on SimpleTix) to support@SimpleTix.com to receive the 10% discount.
            - paragraph [ref=e286]: "SimpleTix partners: Zapier and SalesForce offer discounted plans for charities that we recommend that you sign up for."
