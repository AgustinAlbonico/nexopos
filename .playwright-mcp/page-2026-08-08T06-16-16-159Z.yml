      - generic [ref=e424]:
        - paragraph [ref=e425]: Mercado Pago ofrece servicios de pago y no está autorizado por el Banco Central a operar como entidad financiera. Los fondos acreditados en cuentas de pago no constituyen depósitos en una entidad financiera ni están garantizados conforme legislación aplicable a depósitos en entidades financieras.
        - paragraph [ref=e426]
        - paragraph [ref=e427]:
          - text: No se asegura ni garantiza el resultado de la inversión en Mercado Fondo. Mercado Pago Asset Management S.A. actuará como Sociedad Gerente y Banco Industrial S.A. actuará como Sociedad Depositaria. El valor de la cuotaparte será neto de gastos ordinarios de gestión y de los honorarios de la sociedad gerente y la sociedad depositaria. Los honorarios, gastos y demás información se encuentran disponibles en
          - link "https://inversiones.mercadopago.com.ar" [ref=e428] [cursor=pointer]:
            - /url: https://inversiones.mercadopago.com.ar.
          - text: . No existen honorarios de éxito. Las inversiones en cuotapartes del fondo no constituyen depósito en el Banco Industrial S.A. a los fines de la Ley de Entidades Financieras ni cuenta con ninguna de las garantías que tales depósitos a la vista o a plazo pueden gozar de acuerdo a la legislación y reglamentación aplicables en materia de depósitos en entidades financieras. Asimismo, Banco Industrial S.A. se encuentra impedido por el Banco Central de la República Argentina de asumir tácita o expresamente compromiso alguno en cuanto al mantenimiento, en cualquier momento, del valor del capital invertido, el rendimiento, el valor de rescate de las cuotapartes o el otorgamiento de liquidez a tal fin.
        - paragraph [ref=e429]
        - paragraph [ref=e430]: Otorgamiento de préstamos y tarjeta de crédito sujeto a revisión crediticia, comercial y de riesgos al momento de la solicitud efectuada por el usuario. La presente no implica una obligación de otorgar el préstamo o la tarjeta de crédito, cuya aprobación definitiva quedará condicionada al cumplimiento de las condiciones exigibles por MercadoLibre S.R.L.
        - paragraph [ref=e431]
        - paragraph [ref=e432]: Las marcas de los productos y servicios que pueden abonarse usando la cuenta de Mercado Pago no son propiedad de Mercado Libre, perteneciendo a sus respectivos titulares.
