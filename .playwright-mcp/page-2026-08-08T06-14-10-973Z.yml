            - generic [ref=f27e258]:
              - paragraph [ref=f27e259]: "\"Eventive has been quietly revolutionizing the independent film industry for years. They saw the need to help filmmakers and festivals with a virtual solution for the future of the industry. Eventive helps keep our indie film ecosystem thriving.”"
